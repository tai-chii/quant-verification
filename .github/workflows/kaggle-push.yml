name: kaggle-push
# kernels/<名前>/ または Kaggle 用スクリプトを変更して push すると、Kaggle の Kernel を更新する。
# 提出（competitions submit）はここでは行わない（1日の提出回数に上限があるため）。
on:
  push:
    branches: [main]
    paths:
      - "competitions/kaggle/*/kernels/**"
      - "competitions/kaggle/*/notebooks/kaggle_*.py"
      - "competitions/kaggle/scripts/push_kernels.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install kaggle
      - name: Push kernels to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Secrets が未登録・空だと kaggle が「認証が必要」としか言わないので、先に切り分ける（値は表示しない）
          [ -n "$KAGGLE_USERNAME" ] || { echo "::error::Secret KAGGLE_USERNAME が空（未登録か名前の誤り）"; exit 1; }
          [ -n "$KAGGLE_KEY" ] || { echo "::error::Secret KAGGLE_KEY が空（未登録か名前の誤り）"; exit 1; }
          echo "KAGGLE_USERNAME=$KAGGLE_USERNAME, KAGGLE_KEY の長さ=${#KAGGLE_KEY}"
          # 新しい kaggle CLI でも確実に読まれるよう kaggle.json を作る
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          bash competitions/kaggle/scripts/push_kernels.sh
